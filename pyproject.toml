[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dcp-music-engine"
version = "0.1.0"
description = "Dynamic Canvas Processing: an offline, explainable music-transition engine (Core prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DCP project" }]
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "soundfile>=0.12,<1",
]

[project.optional-dependencies]
analysis = ["librosa>=0.10,<1"]
loudness = ["pyloudnorm>=0.1,<1"]
neural = ["torch>=2.0", "torchaudio>=2.0", "librosa>=0.10,<1"]
separation = ["demucs>=4.0", "torch>=2.0"]
dev = ["pytest>=8,<10"]

[project.scripts]
dcp = "dcp.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
